services:
  postgres:
    build:
      context: ./postgres
    container_name: pragma-postgres-dev
    environment:
      POSTGRES_DB: ${PRAGMA_DB_NAME:-pragma}
      POSTGRES_USER: ${PRAGMA_DB_USER:-pragma}
      POSTGRES_PASSWORD: ${PRAGMA_DB_PASSWORD:-change-me}
    ports:
      - "${PRAGMA_DB_PORT:?PRAGMA_DB_PORT must be set}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -v ON_ERROR_STOP=1 -tAc
          "SELECT current_setting('server_version_num')::integer >= 180000
          AND EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector')
          AND EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'pg_trgm')" | grep -q t
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - pragma-postgres-dev-data:/var/lib/postgresql

volumes:
  pragma-postgres-dev-data:
