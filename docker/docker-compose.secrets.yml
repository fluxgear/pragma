name: pragma-production

# Optional production override for file-secret deployments.
# Use with docker/docker-compose.yml and an env file that sets:
# - PRAGMA_DATABASE_PASSWORD_FILE=/run/secrets/pragma_database_password
# - PRAGMA_JWT_SECRET_KEY_FILE=/run/secrets/pragma_jwt_secret_key
# - PRAGMA_SETUP_SECRET_FILE=/run/secrets/pragma_setup_secret
# - PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE=<host file containing database password; defaults to ./secrets/pragma_database_password relative to docker/>
# - PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE=<host file containing JWT secret; defaults to ./secrets/pragma_jwt_secret_key relative to docker/>
# - PRAGMA_SETUP_SECRET_SECRET_SOURCE=<host file containing setup secret; defaults to ./secrets/pragma_setup_secret relative to docker/>

services:
  db:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true

  migrate:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true
      - type: bind
        source: "${PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE:-./secrets/pragma_jwt_secret_key}"
        target: /run/secrets/pragma_jwt_secret_key
        read_only: true
      - type: bind
        source: "${PRAGMA_SETUP_SECRET_SECRET_SOURCE:-./secrets/pragma_setup_secret}"
        target: /run/secrets/pragma_setup_secret
        read_only: true

  backend:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true
      - type: bind
        source: "${PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE:-./secrets/pragma_jwt_secret_key}"
        target: /run/secrets/pragma_jwt_secret_key
        read_only: true
      - type: bind
        source: "${PRAGMA_SETUP_SECRET_SECRET_SOURCE:-./secrets/pragma_setup_secret}"
        target: /run/secrets/pragma_setup_secret
        read_only: true
