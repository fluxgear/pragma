name: pragma-production

# Optional production override for file-secret deployments.
# Use with docker/docker-compose.yml and an env file that sets:
# - PRAGMA_DATABASE_PASSWORD_FILE=/run/secrets/pragma_database_password
# - PRAGMA_JWT_SECRET_KEY_FILE=/run/secrets/pragma_jwt_secret_key
# - PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE=<host file containing database password; defaults to ./docker/secrets/pragma_database_password>
# - PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE=<host file containing JWT secret; defaults to ./docker/secrets/pragma_jwt_secret_key>

services:
  db:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./docker/secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true

  migrate:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./docker/secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true
      - type: bind
        source: "${PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE:-./docker/secrets/pragma_jwt_secret_key}"
        target: /run/secrets/pragma_jwt_secret_key
        read_only: true

  backend:
    volumes:
      - type: bind
        source: "${PRAGMA_DATABASE_PASSWORD_SECRET_SOURCE:-./docker/secrets/pragma_database_password}"
        target: /run/secrets/pragma_database_password
        read_only: true
      - type: bind
        source: "${PRAGMA_JWT_SECRET_KEY_SECRET_SOURCE:-./docker/secrets/pragma_jwt_secret_key}"
        target: /run/secrets/pragma_jwt_secret_key
        read_only: true
