[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pragma-backend"
version = "1.0.0b6"
description = "Pragma backend for the PostgreSQL-native CMS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "psycopg-pool>=3.2.0,<4.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "PyJWT>=2.10.0,<3.0.0",
  "pwdlib[argon2]>=0.2.1,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "nh3>=0.2.19,<1.0.0",
  "pillow>=10.0,<12.0",
  "pypdf>=5.0,<7.0",
  "mutagen>=1.47,<2.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-xdist>=3.6.0,<4.0.0",
  "ruff>=0.11.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pragma"]

[tool.hatch.build.targets.sdist.force-include]
"../themes" = "themes"

[tool.hatch.build.targets.wheel.shared-data]
"themes" = "lib/themes"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
